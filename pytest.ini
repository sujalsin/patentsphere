[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --asyncio-mode=auto
asyncio_mode = auto
markers =
    unit: Unit tests for individual agents
    integration: Integration tests for graph flow
    e2e: End-to-end evaluation tests
    slow: Tests that take a long time to run
    isolated: Tests that should run in isolation to avoid event loop conflicts

